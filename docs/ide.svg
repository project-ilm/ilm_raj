<text x="32" y="118" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">#अन्तर्भाव &lt;stdio.h&gt;</text>
<text x="32" y="139" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">/* क्रमबद्ध सरणी में द्विआधारी खोज */</text>
<text x="32" y="160" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">पूर्णाङ्क द्विआधारी_खोज(पूर्णाङ्क मूल्यावली[], पूर्णाङ्क गिनती, पूर्णाङ्क कुंजी) {</text>
<text x="32" y="181" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  पूर्णाङ्क निचला = 0, ऊपरी = गिनती - 1;</text>
<text x="32" y="202" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  यावत् (निचला &lt;= ऊपरी) {</text>
<text x="32" y="223" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    पूर्णाङ्क मध्य = निचला + (ऊपरी - निचला) / 2;</text>
<text x="32" y="244" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    यदि (मूल्यावली[मध्य] == कुंजी) प्रत्यागम मध्य;</text>
<text x="32" y="265" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">    यदि (मूल्यावली[मध्य] &lt; कुंजी) निचला = मध्य + 1; अन्यथा ऊपरी = मध्य - 1;</text>
<text x="32" y="286" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  }</text>
<text x="32" y="307" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">  प्रत्यागम -1;</text>
<text x="32" y="328" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">}</text>
<text x="32" y="349" text-anchor="start" direction="ltr" font-family="ui-monospace,monospace" font-size="15" fill="#1d1b17" xml:space="preserve">पूर्णाङ्क मुख्य(शून्य) {</text>
</svg>